</style></head><body><header class="top"><div style="display:flex;gap:10px;align-items:center"><button id="leftToggle" title="Список полок">☰</button><div><div class="brand">REKVIZITOR <span style="color:#fff">/ 2.1</span></div><div id="subtitle" class="sub">ЛОКАЛЬНЫЙ СКЛАД</div></div></div><button id="topAdd" class="gold">＋</button></header><main class="main" id="main"></main><nav class="bottom"><button data-nav="home">⌂ Главная</button><button data-nav="storage" class="sel">▣ Склад</button><button data-nav="search">⌕ Поиск</button><button data-nav="settings">⚙ Настройки</button></nav><div id="modal"></div><div class="toast" id="toast"></div><script>
'use strict';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=()=>crypto.randomUUID();const stores=['rooms','shelves','items','folders','views','points'];const DB='rekvizitor-v2-isolated';let db,rooms=[],shelves=[],items=[],folders=[],views=[],points=[];let screen='home',roomId=null,viewIndex=0,shelfId=null,folderId=null,leftOpen=false,rightOpen=false,onlyPhoto=false,query='',selectedPoint=null,editPointMode=false,photoTemp='';
function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{for(let s of stores)if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s,{keyPath:'id'})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function getAll(s){return new Promise((ok,no)=>{let r=db.transaction(s).objectStore(s).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function save(s,o){return new Promise((ok,no)=>{let r=db.transaction(s,'readwrite').objectStore(s).put(o);r.onsuccess=()=>ok();r.onerror=()=>no(r.error)})}
function remove(s,k){return new Promise((ok,no)=>{let r=db.transaction(s,'readwrite').objectStore(s).delete(k);r.onsuccess=()=>ok();r.onerror=()=>no(r.error)})}
async function reload(){[rooms,shelves,items,folders,views,points]=await Promise.all(stores.map(getAll));render()}
function msg(t){let e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(window._tm);window._tm=setTimeout(()=>e.style.display='none',3200)}
function modal(html){$('#modal').innerHTML=`<div class="sheet"><div class="dialog">${html}</div></div>`}function close(){ $('#modal').innerHTML='';photoTemp=''}
function room(){return rooms.find(x=>x.id===roomId)}function shelf(){return shelves.find(x=>x.id===shelfId)}function currentViews(){return views.filter(x=>x.roomId===roomId).sort((a,b)=>(a.order||0)-(b.order||0))}function view(){return currentViews()[viewIndex]}function folder(){return folders.find(x=>x.id===folderId)}function directItems(){return items.filter(x=>folderId?x.folderId===folderId:x.shelfId===shelfId&&!x.folderId)}function directFolders(){return folders.filter(x=>folderId?x.parentId===folderId:x.shelfId===shelfId&&!x.parentId)}function shelfCounts(s){return {i:items.filter(x=>x.shelfId===s.id&&!x.folderId).length,f:folders.filter(x=>x.shelfId===s.id&&!x.parentId).length}}function photoNumbers(s){return [...new Set(points.filter(p=>p.shelfId===s.id).map(p=>currentViews().findIndex(v=>v.id===p.viewId)+1).filter(n=>n>0))].sort((a,b)=>a-b)}
function nav(to){screen=to;if(to==='home'){roomId=null;leftOpen=false;rightOpen=false}else if(to==='storage'&&!roomId)screen='home';render()}
function render(){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('sel',b.dataset.nav===(screen==='room'?'storage':screen)));$('#subtitle').textContent=room()?room().name.toUpperCase():screen==='settings'?'НАСТРОЙКИ':screen==='search'?'ПОИСК':'КОМНАТЫ';$('#leftToggle').style.visibility=screen==='room'?'visible':'hidden';$('#topAdd').style.visibility=screen==='settings'?'hidden':'visible';if(screen==='home'){renderHome();return}if(screen==='settings'){renderSettings();return}if(screen==='search'){renderSearch();return}renderRoom()}
function renderHome(){let html=`<section class="rooms"><div class="toolbar"><h2 style="margin:0;flex:1">Комнаты хранения</h2><button class="gold" data-action="roomForm">＋ Комната</button></div><div class="roomsgrid">`;for(let r of rooms){let vs=views.filter(v=>v.roomId===r.id),ss=shelves.filter(s=>s.roomId===r.id);html+=`<button class="roomtile" data-action="enterRoom" data-id="${r.id}">${vs[0]?.photo?`<img src="${vs[0].photo}" alt="">`:`<div class="none" style="height:135px;display:grid;place-items:center;font-size:40px">▣</div>`}<div class="label"><b>${esc(r.name)}</b><div class="sub">${ss.length} полок · ${vs.length} ракурсов</div></div></button>`}html+='</div></section>';$('#main').innerHTML=html}
function renderRoom(){let v=view(),vs=currentViews();let ps=points.filter(p=>p.viewId===v?.id);let stage=`<div class="stage" id="stage"><div class="photo-wrap" id="photoWrap">${v?.photo?`<img class="photoview" id="stagePhoto" src="${v.photo}" alt="Фото комнаты">`:`<div class="stageempty"><div style="font-size:40px">▣</div><b>Нет фотографий комнаты</b><span class="sub">Добавь первый ракурс, чтобы размещать точки</span><button data-action="viewForm" class="gold">＋ Добавить фото</button></div>`}</div><div class="overlaygrad"></div><div class="viewbar"><button data-action="prevView" ${viewIndex===0?'disabled':''}>‹</button><span class="small">РАКУРС ${vs.length?viewIndex+1:0} / ${vs.length}</span><button data-action="nextView" ${viewIndex>=vs.length-1?'disabled':''}>›</button><button data-action="viewForm">＋ Фото</button>${v?`<button class="danger" data-action="deleteView" data-id="${v.id}" title="Удалить этот ракурс">✕ Фото</button>`:""}</div><div id="dots">${ps.map(p=>dotHTML(p)).join('')}</div><div class="stage-tools"><button data-action="pointMode" class="${editPointMode?'gold':''}">${editPointMode?'✓ Точки: вкл.':'＋ Точка'}</button></div></div>`;
let visible=shelves.filter(s=>s.roomId===roomId&&(!onlyPhoto||ps.some(p=>p.shelfId===s.id))).sort((a,b)=>a.name.localeCompare(b.name,'ru'));let l=`<aside class="drawer left ${leftOpen?'open':''}" id="leftDrawer"><div class="dhead"><button data-action="home">‹ Комнаты</button><b>ПОЛКИ</b><button data-action="toggleLeft">✕</button></div><div class="dcontent"><div class="toolbar"><button class="${!onlyPhoto?'gold':''}" data-action="filterAll">Все</button><button class="${onlyPhoto?'gold':''}" data-action="filterPhoto">На фото</button><button data-action="shelfForm">＋</button></div>${visible.map(s=>{let c=shelfCounts(s),p=photoNumbers(s);return `<div class="shelfrow ${s.id===shelfId?'on':''}" data-action="openShelf" data-id="${s.id}"><strong>${esc(s.name)}</strong><div><span class="code">${esc(s.code||s.id.slice(0,8))}</span> <span class="sub">${p.length?'Фото '+p.join(', '):'Нет точек'}</span></div><div class="counts">${c.i} предметов · ${c.f} папок</div><button class="small" style="margin-top:7px" data-action="shelfForm" data-id="${s.id}">Изменить</button></div>`}).join('')||'<div class="hint">Нет полок в выбранном фильтре</div>'}</div></aside>`;
let sh=shelf(),current=folder(),its=directItems(),fs=directFolders();let r=`<aside class="drawer right ${rightOpen?'open':''} ${leftOpen?'withleft':''}" id="rightDrawer"><div class="dhead"><div><b>${esc(current?.name||sh?.name||'Полка')}</b><div class="sub">${sh?esc(sh.code||sh.id.slice(0,8)):''} · ${its.length} предметов · ${fs.length} папок</div></div><button data-action="toggleRight">✕</button></div><div class="dcontent"><div class="toolbar breadcrumb"><button data-action="rootFolder">${esc(sh?.name||'Полка')}</button>${folderPath().map(f=>`<span>›</span><button data-action="openFolder" data-id="${f.id}">${esc(f.name)}</button>`).join('')}</div><div class="toolbar"><button class="gold" data-action="itemForm">＋ Предмет</button><button data-action="folderForm">＋ Папка</button><button data-action="movePicker">↪ Переместить</button><button data-action="shelfForm" data-id="${shelfId}">⚙ Полка</button></div>${current?`<button data-action="folderDetail" data-id="${current.id}" style="margin-bottom:9px">⚙ Изменить текущую папку</button>`:""}<div class="hint" style="margin-bottom:8px">Для переноса открой карточку и нажми «Переместить».</div><div class="cards">${fs.map(f=>tileHTML(f,'folder')).join('')}${its.map(i=>tileHTML(i,'item')).join('')}</div>${!fs.length&&!its.length?'<p class="hint">Здесь пока пусто</p>':''}</div></aside>`;
$('#main').innerHTML=stage+l+r;placeDots()}
function dotHTML(p){let s=shelves.find(x=>x.id===p.shelfId);return `<button class="dot ${s?.id===shelfId?'selected':''}" data-action="dot" data-id="${p.id}" style="left:${p.x*100}%;top:${p.y*100}%" title="${esc(s?.name||'Полка')}" aria-label="${esc(s?.name||'Полка')}"><span class="sr-only">${esc(s?.name||'Полка')}</span></button>`}
function placeDots(){let img=$('#stagePhoto'),wrap=$('#photoWrap'),dots=$('#dots');if(!img||!dots)return;let update=()=>{let r=wrap.getBoundingClientRect(),w=img.naturalWidth,h=img.naturalHeight;if(!w||!h)return;let scale=Math.min(r.width/w,r.height/h),dw=w*scale,dh=h*scale,ox=(r.width-dw)/2,oy=(r.height-dh)/2;dots.querySelectorAll('.dot').forEach(el=>{let p=points.find(x=>x.id===el.dataset.id);el.style.left=(ox+p.x*dw)+'px';el.style.top=(oy+p.y*dh)+'px'})};img.addEventListener('load',update);if(img.complete)update();window._dotUpdate=update}
function tileHTML(o,type){let isFolder=type==='folder',count=isFolder?items.filter(i=>i.folderId===o.id).length:0;return `<div class="tile" data-tile="${type}" data-id="${o.id}"  data-action="${isFolder?'openFolder':'viewItem'}">${o.photo?`<img src="${o.photo}" alt="">`:`<div class="none">${isFolder?'▣':'▤'}</div>`}<div class="txt"><strong>${esc(o.name)}</strong><span>${isFolder?`${count} предметов · ${folders.filter(f=>f.parentId===o.id).length} папок`:`${esc(o.condition||'Исправен')} · ${o.quantity||1} шт.`}</span></div></div>`}
function folderPath(){let path=[],f=folder(),guard=0;while(f&&guard++<50){path.unshift(f);f=folders.find(x=>x.id===f.parentId)}return path}
function renderSettings(){let html=`<section class="settings"><h2>Настройки и данные</h2><article><b>Отдельная база 2.0</b><p class="hint">Эта версия использует IndexedDB «${DB}» и не изменяет хранилище 1.0. Для переноса используй резервную копию JSON.</p><div class="toolbar"><button class="gold" data-action="export">⬇ Экспорт 2.0</button><button data-action="importDialog">⬆ Импорт 1.0 / 2.0</button></div></article><article><b>Сводка</b><p>${rooms.length} комнат · ${shelves.length} полок · ${items.length} предметов · ${folders.length} папок · ${views.length} фотографий комнат · ${points.length} точек</p></article><article><b>Работа офлайн</b><p class="hint">После первой загрузки с HTTPS и установки PWA интерфейс доступен без сети. Данные хранятся только на этом устройстве. Регулярно экспортируй JSON — удаление данных браузера удалит локальную базу.</p></article><article><b>Управление</b><p class="hint">Панели открываются кнопками. Ракурсы переключаются стрелками. Предметы и папки перемещаются через меню. Вертикальный экран — основной.</p></article></section>`;$('#main').innerHTML=html}
function renderSearch(){let q=query.toLocaleLowerCase('ru').trim().split(/\s+/).filter(Boolean),roomFilter=window.searchRoom||'',kind=window.searchKind||'all';let candidateItems=items.filter(i=>q.every(t=>[i.name,i.description,...(i.tags||[])].join(' ').toLocaleLowerCase('ru').includes(t)));let candidateFolders=folders.filter(f=>q.every(t=>[f.name,f.description].join(' ').toLocaleLowerCase('ru').includes(t)));let matchedRooms=rooms.filter(r=>!roomFilter||r.id===roomFilter);let html=`<section class="settings searchpage"><h2>Поиск по складам</h2><input id="search" class="search" placeholder="Название, теги, описание…" value="${esc(query)}"><div class="toolbar"><label class="sub">Комната <select id="searchRoom" class="search-select"><option value="">Все комнаты</option>${rooms.map(r=>`<option value="${r.id}" ${roomFilter===r.id?'selected':''}>${esc(r.name)}</option>`).join('')}</select></label><label class="sub">Показывать <select id="searchKind" class="search-select"><option value="all" ${kind==='all'?'selected':''}>Папки и предметы</option><option value="folders" ${kind==='folders'?'selected':''}>Только папки</option><option value="items" ${kind==='items'?'selected':''}>Только предметы</option></select></label></div>`;let total=0;for(let r of matchedRooms){let rs=shelves.filter(s=>s.roomId===r.id),roomHTML='';for(let sh of rs){let ff=candidateFolders.filter(f=>f.shelfId===sh.id),ii=candidateItems.filter(i=>i.shelfId===sh.id);if(kind==='items')ff=[];if(kind==='folders')ii=[];if(!ff.length&&!ii.length)continue;total+=ff.length+ii.length;let direct=ii.filter(i=>!i.folderId),nested=ii.filter(i=>i.folderId);roomHTML+=`<div class="search-shelf"><div class="search-shelf-title">▤ ${esc(sh.name)} <span class="code">${esc(sh.code||sh.id.slice(0,8))}</span></div>${ff.length?`<div class="sub">Папки · ${ff.length}</div><div class="cards">${ff.map(f=>tileHTML(f,'folder')).join('')}</div>`:''}${direct.length?`<div class="sub">Предметы на полке · ${direct.length}</div><div class="cards">${direct.map(i=>tileHTML(i,'item')).join('')}</div>`:''}${nested.length?`<div class="sub">Предметы внутри папок · ${nested.length}</div><div class="cards">${nested.map(i=>`<div>${tileHTML(i,'item')}<div class="sub" style="margin:3px 0 10px">▣ ${esc(folders.find(f=>f.id===i.folderId)?.name||'Папка')}</div></div>`).join('')}</div>`:''}</div>`}if(roomHTML)html+=`<section class="search-room"><h3>▣ ${esc(r.name)}</h3>${roomHTML}</section>`}html+=`<p class="sub">Найдено карточек: ${total}. Папки показаны раньше отдельных предметов.</p></section>`;$('#main').innerHTML=html}

function selectRoom(rid){roomId=rid;viewIndex=0;shelfId=null;folderId=null;screen='room';leftOpen=false;rightOpen=false;render()}

function formWrap(title,fields,saveLabel='Сохранить'){modal(`<h2>${title}</h2><form id="editForm">${fields}<div class="actions"><button type="button" data-action="close">Отмена</button><button class="gold" type="submit">${saveLabel}</button></div></form>`)}
function field(label,key,value='',type='text',extra=''){return `<label class="field">${label}<input name="${key}" type="${type}" value="${esc(value)}" ${extra}></label>`}
function fileField(label='Фото'){return `<label class="field">${label}<input name="photoFile" type="file" accept="image/*"></label><div id="photoPreview"></div>`}
async function readPhoto(file,max=1600){if(!file)return photoTemp;if(file.size>30e6)throw Error('Файл слишком большой');let url=URL.createObjectURL(file);try{let im=new Image();await new Promise((ok,no)=>{im.onload=ok;im.onerror=no;im.src=url});let sc=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));let cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(im.naturalWidth*sc));cv.height=Math.max(1,Math.round(im.naturalHeight*sc));cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);return cv.toDataURL('image/jpeg',.82)}finally{URL.revokeObjectURL(url)}}
function attachPhoto(old){photoTemp=old||'';let file=$('[name=photoFile]');let prev=$('#photoPreview');function show(){prev.innerHTML=photoTemp?`<img class="preview" src="${photoTemp}"><button type="button" id="clearPhoto">Убрать фото</button>`:'';let b=$('#clearPhoto');if(b)b.onclick=()=>{photoTemp='';show()}}show();file.onchange=async()=>{try{photoTemp=await readPhoto(file.files[0]);show()}catch(e){msg(e.message)}}}
function roomForm(rid){let old=rooms.find(r=>r.id===rid);formWrap(old?'Комната':'Новая комната',field('Название','name',old?.name||'','text','required maxlength="120"'));$('#editForm').onsubmit=async e=>{e.preventDefault();await save('rooms',{...old,id:old?.id||id(),name:e.target.elements.namedItem("name").value.trim()});close();await reload()}}

function viewForm(){if(!roomId)return;formWrap('Добавить ракурс комнаты',field('Название ракурса','name','Вид '+(currentViews().length+1),'text','required')+fileField('Фотография комнаты (PNG, JPG и др.)'));attachPhoto('');$('#editForm').onsubmit=async e=>{e.preventDefault();if(!photoTemp){msg('Добавь фотографию');return}await save('views',{id:id(),roomId,name:e.target.elements.namedItem("name").value.trim(),photo:photoTemp,order:currentViews().length});viewIndex=currentViews().length;close();await reload()}}
function pointForm(x,y,pid){let old=points.find(p=>p.id===pid);if(!view()){msg('Сначала добавь фото');return}formWrap(old?'Изменить точку':'Новая точка',field('ID полки или складской код','ref',shelves.find(s=>s.id===old?.shelfId)?.code||old?.shelfId||'','text','required')+`<p class="hint">Можно указать полный UUID, складской код или выбрать полку из списка ниже.</p><label class="field">Выбрать полку<select name="pick"><option value="">— По введённому коду —</option>${shelves.filter(s=>s.roomId===roomId).map(s=>`<option value="${s.id}" ${s.id===old?.shelfId?'selected':''}>${esc(s.name)} · ${esc(s.code||s.id.slice(0,8))}</option>`).join('')}</select></label>`);$('#editForm').onsubmit=async e=>{e.preventDefault();let f=e.target,ref=f.elements.namedItem("pick").value||f.elements.namedItem("ref").value.trim(),s=shelves.find(s=>s.id===ref||s.code?.toLocaleLowerCase('ru')===ref.toLocaleLowerCase('ru'));if(!s||s.roomId!==roomId){msg('Полка не найдена в этой комнате');return}await save('points',{id:old?.id||id(),viewId:view().id,shelfId:s.id,x:old?.x??x,y:old?.y??y});close();editPointMode=false;await reload()}}
function folderForm(fid){let old=folders.find(f=>f.id===fid);if(!shelfId)return;formWrap(old?'Редактировать папку':'Новая папка',field('Название','name',old?.name||'','text','required')+field('Описание','description',old?.description||'')+fileField('Фото ящика или содержимого'));attachPhoto(old?.photo);$('#editForm').onsubmit=async e=>{e.preventDefault();await save('folders',{...old,id:old?.id||id(),shelfId:old?.shelfId||shelfId,parentId:old?.parentId??folderId??null,name:e.target.elements.namedItem("name").value.trim(),description:e.target.description.value.trim(),photo:photoTemp});close();await reload()}}
function itemForm(iid){let old=items.find(i=>i.id===iid);if(!shelfId&& !old){msg('Выбери полку');return}formWrap(old?'Изменить предмет':'Новый предмет',field('Название','name',old?.name||'','text','required')+field('Количество','quantity',old?.quantity||1,'number','min="1" required')+field('Теги через запятую','tags',(old?.tags||[]).join(', '))+`<label class="field">Состояние<select name="condition">${['Исправен','Повреждён','Нуждается в ремонте','На ремонте'].map(x=>`<option ${x===old?.condition?'selected':''}>${x}</option>`).join('')}</select></label><label class="field">Описание<textarea name="description">${esc(old?.description||'')}</textarea></label>`+fileField());attachPhoto(old?.photo);$('#editForm').onsubmit=async e=>{e.preventDefault();let f=e.target;await save('items',{...old,id:old?.id||id(),shelfId:old?.shelfId||shelfId,folderId:old?.folderId??folderId??null,name:f.elements.namedItem("name").value.trim(),quantity:Math.max(1,Number(f.elements.namedItem("quantity").value)||1),tags:[...new Set(f.elements.namedItem("tags").value.split(',').map(t=>t.trim().toLocaleLowerCase('ru')).filter(Boolean))],condition:f.elements.namedItem("condition").value,description:f.elements.namedItem("description").value.trim(),photo:photoTemp,updatedAt:new Date().toISOString()});close();await reload()}}
function viewItem(iid){let i=items.find(x=>x.id===iid);if(!i)return;modal(`<h2>${esc(i.name)}</h2>${i.photo?`<img class="detailphoto" src="${i.photo}">`:''}<p class="small">Количество: ${i.quantity||1} · ${esc(i.condition||'Исправен')}</p><p>${(i.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</p><p class="hint">${esc(i.description||'Без описания')}</p><p class="sub">${esc(shelves.find(s=>s.id===i.shelfId)?.name||'Без полки')} ${i.folderId?'› '+esc(folders.find(f=>f.id===i.folderId)?.name):''}</p><div class="actions"><button data-action="close">Закрыть</button><button data-action="moveOne" data-id="${i.id}">↪ Переместить</button><button class="gold" data-action="itemForm" data-id="${i.id}">Изменить</button><button class="danger" data-action="deleteItem" data-id="${i.id}">Удалить</button></div>`)}
function folderDetail(fid){let f=folders.find(x=>x.id===fid);modal(`<h2>${esc(f.name)}</h2>${f.photo?`<img class="detailphoto" src="${f.photo}">`:''}<p class="hint">${esc(f.description||'')}</p><div class="actions"><button data-action="close">Закрыть</button><button data-action="moveOneFolder" data-id="${fid}">Переместить</button><button class="gold" data-action="folderForm" data-id="${fid}">Изменить</button><button class="danger" data-action="deleteFolder" data-id="${fid}">Удалить</button></div>`)}
function movePicker(type='item',iid){let o=type==='item'?items.find(x=>x.id===iid):folders.find(x=>x.id===iid);let targets=folders.filter(f=>f.id!==iid);modal(`<h2>Перемещение</h2><p class="hint">Выбери объект и место назначения. Для переноса между полками выбери корень полки.</p><form id="moveForm"><label class="field">Объект<select name="object">${o?`<option value="${o.id}">${esc(o.name)}</option>`:[...items.filter(i=>i.shelfId===shelfId).map(i=>`<option value="i:${i.id}">Предмет · ${esc(i.name)}</option>`),...folders.filter(f=>f.shelfId===shelfId).map(f=>`<option value="f:${f.id}">Папка · ${esc(f.name)}</option>`)].join('')}</select></label><label class="field">Назначение<select name="destination">${shelves.map(s=>`<option value="s:${s.id}">${esc(rooms.find(r=>r.id===s.roomId)?.name)} / ${esc(s.name)}</option>`).join('')}${targets.map(f=>`<option value="f:${f.id}">▣ ${esc(f.name)} (${esc(shelves.find(s=>s.id===f.shelfId)?.name)})</option>`).join('')}</select></label><div class="actions"><button type="button" data-action="close">Отмена</button><button class="gold">Переместить</button></div></form>`);$('#moveForm').onsubmit=async e=>{e.preventDefault();let val=e.target.elements.namedItem("object").value,dest=e.target.elements.namedItem("destination").value,t=o?type:val.startsWith('f:')?'folder':'item',oid=o?o.id:val.slice(2);await moveObject(t,oid,dest);close();await reload()}}
function isDescendant(fid,parent){let seen=new Set();while(parent&&!seen.has(parent)){if(parent===fid)return true;seen.add(parent);parent=folders.find(f=>f.id===parent)?.parentId}return false}
async function moveObject(type,oid,dest){let isF=type==='folder',obj=(isF?folders:items).find(o=>o.id===oid);if(!obj)return;let targetF=dest.startsWith('f:')?folders.find(f=>f.id===dest.slice(2)):null;let targetS=targetF?.shelfId||dest.slice(2);if(!shelves.some(s=>s.id===targetS))throw Error('Полка не найдена');if(isF&&(targetF?.id===oid||isDescendant(oid,targetF?.id)))throw Error('Нельзя переместить папку внутрь самой себя');let updated={...obj,shelfId:targetS,[isF?'parentId':'folderId']:targetF?.id||null};let affected=[];if(isF){let ids=new Set([oid]),changed=true;while(changed){changed=false;for(let f of folders)if(f.parentId&&ids.has(f.parentId)&&!ids.has(f.id)){ids.add(f.id);changed=true}}affected=[...folders.filter(f=>ids.has(f.id)&&f.id!==oid).map(f=>({...f,shelfId:targetS})),...items.filter(i=>i.folderId&&ids.has(i.folderId)).map(i=>({...i,shelfId:targetS}))]}
await new Promise((ok,no)=>{let tx=db.transaction(isF?['folders','items']:['items'],'readwrite');tx.oncomplete=ok;tx.onerror=()=>no(tx.error);tx.objectStore(isF?'folders':'items').put(updated);for(let f of affected)tx.objectStore(f.parentId!==undefined?'folders':'items').put(f)})}
function importDialog(){modal(`<h2>Импорт базы</h2><p class="hint">Поддерживаются JSON-резервные копии Rekvizitor 1.0 и 2.0. Импорт выполняется в отдельную базу 2.0, исходная база 1.0 не затрагивается. Перед заменой существующей базы 2.0 рекомендуется экспорт.</p><input type="file" id="importFile" accept=".json,application/json"><div id="importPreview" class="hint" style="margin-top:10px"></div><div class="actions"><button data-action="close">Отмена</button><button class="gold" id="importCommit" disabled>Импортировать</button></div>`);let candidate=null;$('#importFile').onchange=async e=>{try{candidate=JSON.parse(await e.target.files[0].text());validateBackup(candidate);$('#importPreview').textContent=`Версия ${candidate.version} · ${candidate.rooms.length} комнат · ${candidate.shelves.length} полок · ${candidate.items.length} предметов · ${candidate.items.filter(i=>i.photo).length} фото предметов. ${candidate.version===2?candidate.folders.length+' папок · '+candidate.views.length+' ракурсов':''}`;$('#importCommit').disabled=false}catch(err){candidate=null;$('#importPreview').textContent='Ошибка: '+err.message;$('#importCommit').disabled=true}};$('#importCommit').onclick=async()=>{if(!candidate)return;if(!confirm('Заменить текущую базу 2.0? Исходная база 1.0 не изменится.'))return;try{await importBackup(candidate);close();roomId=null;shelfId=null;screen='home';await reload();msg('Импорт завершён')}catch(err){msg('Импорт не удался: '+err.message)}}}
function validateBackup(d){if(d?.format!=='rekvizitor-backup'||![1,2].includes(d.version))throw Error('Неподдерживаемый формат');let names=d.version===1?stores.slice(0,3):stores;if(!names.every(s=>Array.isArray(d[s])))throw Error('Отсутствуют разделы базы');let ids=new Set();for(let s of names)for(let x of d[s]){if(!x||typeof x.id!=='string'||!x.id||typeof x.name!=='string'&&['rooms','shelves','items','folders','views'].includes(s))throw Error('Неверная запись '+s);if(ids.has(x.id))throw Error('Повторяется ID '+x.id);ids.add(x.id)}let rs=new Set(d.rooms.map(x=>x.id)),ss=new Set(d.shelves.map(x=>x.id));if(d.shelves.some(s=>!rs.has(s.roomId))||d.items.some(i=>!ss.has(i.shelfId)))throw Error('Нарушены связи складов');if(d.version===2){let fs=new Set(d.folders.map(x=>x.id)),vs=new Set(d.views.map(x=>x.id));if(d.folders.some(f=>!ss.has(f.shelfId)||f.parentId&&!fs.has(f.parentId))||d.items.some(i=>i.folderId&&!fs.has(i.folderId))||d.views.some(v=>!rs.has(v.roomId))||d.points.some(p=>!ss.has(p.shelfId)||!vs.has(p.viewId)))throw Error('Нарушены связи 2.0');let codes=new Set();for(let s of d.shelves)if(s.code){let c=s.code.toLowerCase();if(codes.has(c))throw Error('Повтор складского кода');codes.add(c)}for(let f of d.folders){let seen=new Set(),cur=f;while(cur?.parentId){if(seen.has(cur.id))throw Error('Цикл папок');seen.add(cur.id);cur=d.folders.find(x=>x.id===cur.parentId)}}}return true}
async function importBackup(d){validateBackup(d);let normalized={rooms:d.rooms,shelves:d.shelves.map(s=>({...s,code:s.code||''})),items:d.items.map(i=>({...i,folderId:i.folderId||null})),folders:d.folders||[],views:d.views||[],points:d.points||[]};await new Promise((ok,no)=>{let tx=db.transaction(stores,'readwrite');tx.oncomplete=ok;tx.onerror=()=>no(tx.error);tx.onabort=()=>no(tx.error||Error('Транзакция прервана'));for(let s of stores){let os=tx.objectStore(s);os.clear();for(let x of normalized[s])os.put(x)}})}
async function exportBackup(){let data={format:'rekvizitor-backup',version:2,createdAt:new Date().toISOString(),rooms,shelves,items,folders,views,points};let url=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download='rekvizitor-v2-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),20000);msg('Резервная копия подготовлена')}
async function createFolderFromDrop(source,target){let src=source.dataset,tar=target.dataset;if(src.id===tar.id&&src.tile===tar.tile)return;if(tar.tile==='folder'){await moveObject(src.tile,src.id,'f:'+tar.id);await reload();msg('Перемещено в папку');return}if(tar.tile==='item'){let a=items.find(i=>i.id===src.id),b=items.find(i=>i.id===tar.id);if(!b||!a||src.tile!=='item')return;let name=prompt('Название новой папки','Новая папка');if(!name?.trim())return;let fid=id(),sh=b.shelfId,parent=b.folderId||null;await save('folders',{id:fid,name:name.trim(),description:'',photo:b.photo||'',shelfId:sh,parentId:parent});await moveObject('item',a.id,'f:'+fid);await moveObject('item',b.id,'f:'+fid);await reload();msg('Папка создана')}}
async function deleteView(vid){let v=views.find(x=>x.id===vid);if(!v)return;let attached=points.filter(p=>p.viewId===vid);if(!confirm(`Удалить ракурс «${v.name||'Без названия'}»?\nБудет удалена фотография и ${attached.length} точек на ней. Полки, папки и реквизит останутся без изменений.`))return;await new Promise((ok,no)=>{let tx=db.transaction(['views','points'],'readwrite');tx.objectStore('views').delete(vid);for(let pt of attached)tx.objectStore('points').delete(pt.id);tx.oncomplete=ok;tx.onerror=()=>no(tx.error);tx.onabort=()=>no(tx.error)});viewIndex=Math.max(0,Math.min(viewIndex,currentViews().length-2));await reload();msg('Ракурс удалён. Реквизит сохранён')}
async function dispatch(a,oid){switch(a){case'home':nav('home');break;case'toggleLeft':toggleLeft();break;case'toggleRight':toggleRight();break;case'enterRoom':selectRoom(oid);break;case'roomForm':roomForm(oid);break;case'shelfForm':shelfForm(oid);break;case'viewForm':viewForm();break;case'pointMode':editPointMode=!editPointMode;render();msg(editPointMode?'Коснись фото, чтобы создать точку':'Режим точек выключен');break;case'prevView':viewIndex=Math.max(0,viewIndex-1);render();break;case'nextView':viewIndex=Math.min(currentViews().length-1,viewIndex+1);render();break;case'deleteView':await deleteView(oid);break;case'filterAll':onlyPhoto=false;render();break;case'filterPhoto':onlyPhoto=true;render();break;case'openShelf':shelfId=oid;folderId=null;rightOpen=true;render();break;case'dot':{let p=points.find(p=>p.id===oid);if(editPointMode){pointForm(null,null,oid);return}shelfId=p?.shelfId;folderId=null;rightOpen=true;render();break}case'rootFolder':folderId=null;render();break;case'openFolder':{let f=folders.find(f=>f.id===oid);if(!f)break;let sh=shelves.find(s=>s.id===f.shelfId);if(sh){roomId=sh.roomId;shelfId=sh.id;screen='room';rightOpen=true}folderId=oid;render();break}case'folderForm':folderForm(oid);break;case'folderDetail':folderDetail(oid);break;case'itemForm':itemForm(oid);break;case'viewItem':viewItem(oid);break;case'movePicker':movePicker();break;case'moveOne':movePicker('item',oid);break;case'moveOneFolder':movePicker('folder',oid);break;case'close':close();break;case'importDialog':importDialog();break;case'export':await exportBackup();break;case'deleteItem':if(confirm('Удалить предмет?')){await remove('items',oid);close();await reload()}break;case'deleteFolder':if(items.some(i=>i.folderId===oid)||folders.some(f=>f.parentId===oid)){msg('Сначала перемести содержимое папки');return}if(confirm('Удалить пустую папку?')){await remove('folders',oid);close();folderId=null;await reload()}break}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(b){e.stopPropagation();dispatch(b.dataset.action,b.dataset.id).catch(err=>{console.error(err);msg(err.message||'Ошибка')})}});document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>nav(b.dataset.nav));$('#leftToggle').onclick=()=>{if(screen==='room')toggleLeft()};$('#topAdd').onclick=()=>{if(screen==='room')shelfForm();else roomForm()};document.addEventListener('change',e=>{if(e.target.id==='searchRoom'){window.searchRoom=e.target.value;renderSearch()}if(e.target.id==='searchKind'){window.searchKind=e.target.value;renderSearch()}});document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;let at=e.target.selectionStart;renderSearch();$('#search').focus();$('#search').setSelectionRange(at,at)}});
$('#main').addEventListener('click',e=>{if(!editPointMode||!view()||!e.target.closest('#photoWrap'))return;let im=$('#stagePhoto');if(!im)return;let r=im.getBoundingClientRect(),sc=Math.min(r.width/im.naturalWidth,r.height/im.naturalHeight),w=im.naturalWidth*sc,h=im.naturalHeight*sc,ox=r.left+(r.width-w)/2,oy=r.top+(r.height-h)/2,x=(e.clientX-ox)/w,y=(e.clientY-oy)/h;if(x<0||x>1||y<0||y>1)return;pointForm(x,y)});
window.addEventListener('resize',()=>window._dotUpdate?.());
(async()=>{try{db=await openDB();await reload();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{})}catch(err){console.error(err);$('#main').innerHTML='<div class="settings">Ошибка открытия локальной базы. Запусти приложение через HTTPS или localhost в Chrome.</div>'}})();
